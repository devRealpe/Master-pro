name: master_pro
description: "Master Pro, aplicativo de maestría"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^7.2.0
  cupertino_ui: ^1.1.7
  firebase_auth: ^7.1.0
  firebase_core: ^5.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#0A0A1A"
  adaptive_icon_foreground: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
